<script>
(function(){
  var BUILD_VERSION = '2026-08-04-203154';
  var params = new URLSearchParams(location.search);
  if (params.get('v') !== BUILD_VERSION){
    params.set('v', BUILD_VERSION);
    location.replace(location.pathname + '?' + params.toString());
  }
})();
</script>

<style>
  /* ===== 색상/토큰: 밤하늘·보물 테마 ===== */
  :root{
    --bg:#12203A; --panel:#1B2E52; --panel-2:#24386A;
    --gold:#F6C453; --coral:#FF7A59; --mint:#4ECCA3; --red:#FF6B6B;

  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1d3a6e 0%, transparent 60%),
      var(--bg);
    background-color:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  h1,h2,h3,.jua{ font-family:'Jua', sans-serif; font-weight:400; letter-spacing:.5px; }

  #app{ max-width:520px; margin:0 auto; padding:16px 16px 96px; position:relative; }

  /* ===== 로그인 화면 ===== */
  #loginScreen{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  #loginScreen .logo{ font-size:64px; margin-bottom:8px; }
  #loginScreen h1{ font-size:28px; margin:0 0 6px; }
  #loginScreen p{ color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 24px; max-width:340px; }
  #loginScreen input{
    width:100%; max-width:300px; text-align:center; font-family:'Jua'; font-size:22px;
    background:var(--panel); border:2px solid var(--line); color:var(--text);
    border-radius:16px; padding:14px; margin-bottom:14px; outline:none;
  }
  #loginScreen input:focus{ border-color:var(--gold); }
  #loginScreen button{
    width:100%; max-width:300px; background:var(--coral); color:#fff; border:none;
    font-family:'Jua'; font-size:19px; padding:15px; border-radius:16px; cursor:pointer;
    box-shadow:0 5px 0 #c8583c;
  }
  #loginScreen button:active{ transform:translateY(4px); box-shadow:0 1px 0 #c8583c; }
  #loginScreen .mode{ margin-top:20px; font-size:12px; color:#5b6f9c; }

  /* ===== 상단 상태바 ===== */
  .topbar{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:2px solid var(--line);
    border-radius:18px; padding:12px 14px; margin-bottom:8px;
  }
  .avatar{
    width:46px; height:46px; border-radius:14px; flex:none;
    background:linear-gradient(145deg,#3b5bb0,#24386A);
    display:grid; place-items:center; font-size:26px; border:2px solid var(--panel-2);
  }
  .lv-wrap{ flex:1; min-width:0; }
  .lv-line{ display:flex; align-items:baseline; gap:6px; }
  .lv-line b{ font-family:'Jua'; font-size:16px; }
  .lv-line span{ color:var(--muted); font-size:12px; }
  .expbar{ height:9px; background:#0e1830; border-radius:99px; margin-top:6px; overflow:hidden; }
  .expbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--mint),#7ef0c9); width:0%; transition:width .5s; }
  .gold-pill{
    flex:none; background:#0e1830; border:2px solid var(--gold); color:var(--gold);
    font-family:'Jua'; font-size:15px; padding:8px 12px; border-radius:14px;
    display:flex; align-items:center; gap:6px;
  }
  .cal-btn{
    flex:none; background:var(--panel-2); border:none; color:var(--text);
    width:38px; height:38px; border-radius:12px; font-size:17px; cursor:pointer;
  }
  /* 동기화 상태 표시줄 */
  .sync-status{ font-size:11px; color:var(--muted); text-align:right; margin:0 6px 16px; height:14px; }
  .sync-status.saved{ color:var(--mint); }
  .sync-status.saving{ color:var(--gold); }
  .sync-status.error{ color:var(--red); }

  .screen{ display:none; animation:fade .35s ease; }

  .hello{
    background:linear-gradient(135deg,#26407e,#1B2E52);
    border:2px solid var(--line); border-radius:20px; padding:16px 18px; margin-bottom:16px;
  }
  .hello .msg{ font-family:'Jua'; font-size:17px; line-height:1.5; }
  .hello .sub{ color:var(--muted); font-size:13px; margin-top:6px; }

  .section-title{ font-family:'Jua'; font-size:19px; margin:20px 4px 12px; display:flex; align-items:center; gap:8px; }

  .term-select{
    display:block; margin:0 4px 14px; background:var(--panel); border:2px solid var(--line);
    color:var(--text); font-family:'Gowun Dodum'; font-size:13px; padding:8px 10px; border-radius:12px;

  .quest{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:2px solid var(--line);

  .stage-num{

  .card .emoji{ font-size:38px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .card.locked .emoji{ filter:grayscale(1) brightness(.4); }
  .card .name{ font-family:'Jua'; font-size:13px; margin-top:6px; }

  .shop-note{ color:var(--muted); font-size:13px; margin:0 4px 14px; line-height:1.5; }

  .buy-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #c99b2f; }
  .buy-btn:disabled{ background:#3a4870; color:#6b7ba6; box-shadow:none; cursor:not-allowed; }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:520px; margin:0 auto;

  .tab{ background:none; border:none; color:var(--muted); font-family:'Jua'; font-size:12px; padding:8px 0; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .tab .ic{ font-size:22px; }
  .tab.active{ color:var(--gold); }

  .modal-bg{
    position:fixed; inset:0; z-index:60; background:rgba(6,12,26,.82);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .modal-bg.open{ display:flex; }
  .modal{

  .modal-head .tag{ font-family:'Jua'; font-size:13px; color:var(--gold); }

  .tts-btn{

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{

  .opt.wrong{ border-color:var(--red); background:rgba(255,107,107,.12); }

  .feedback{ margin-top:16px; text-align:center; display:none; }
  .feedback.show{ display:block; animation:fade .3s; }
  .feedback .big{ font-family:'Jua'; font-size:20px; }
  .feedback .hint{ background:#0e1830; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:13px; color:var(--gold); line-height:1.5; }
  .next-btn{
    width:100%; margin-top:16px; background:var(--coral); color:#fff; border:none;
    font-family:'Jua'; font-size:17px; padding:15px; border-radius:16px; cursor:pointer; box-shadow:0 5px 0 #c8583c;

  .next-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #c8583c; }

  .reward-pop{ text-align:center; padding:10px 0; }
  .reward-pop .emoji{ font-size:70px; animation:pop .5s ease; }
  @keyframes pop{ 0%{transform:scale(0);} 70%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .reward-pop .title{ font-family:'Jua'; font-size:22px; margin-top:8px; }
  .reward-pop .gain{ color:var(--gold); font-family:'Jua'; font-size:16px; margin-top:6px; }

  .cal-nav{ display:flex; align-items:center; justify-content:center; gap:18px; margin:4px 0 14px; font-family:'Jua'; font-size:15px; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow{ text-align:center; color:var(--muted); font-size:11px; padding:4px 0; }
  .cal-cell{ aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-size:12px; position:relative; }
  .cal-cell.empty{ visibility:hidden; }
  .cal-cell:not(.empty){ background:#0e1830; }
  .cal-cell.today{ border:2px solid var(--gold); }
  .cal-cell.attended{ background:rgba(78,204,163,.18); }
  .cal-cell .dot{ width:5px; height:5px; border-radius:50%; background:var(--mint); margin-top:2px; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#0e1830; border:2px solid var(--gold); color:var(--gold);
    font-family:'Jua'; padding:12px 18px; border-radius:14px; z-index:80;
    opacity:0; transition:.3s; pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .reset-link{ text-align:center; margin-top:24px; }
  .reset-link button{ background:none; border:none; color:#5b6f9c; font-size:12px; text-decoration:underline; cursor:pointer; }
</style>

<!-- ===== 로그인 화면 (탐험가 번호 입력) ===== -->
<div id="loginScreen">

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1) 클라우드(Firebase) 래퍼
   ------------------------------------------------------------
   설정이 채워져 있으면 Firestore 사용, 아니면 자동으로 꺼짐.
   ============================================================ */
const Cloud = {
  db:null, ready:false,
  init(){
    const cfg = window.FIREBASE_CONFIG;
    // 설정값이 비어 있거나 예시값이면 클라우드 사용 안 함
    if (!cfg || !cfg.apiKey || cfg.apiKey.indexOf('붙여넣기') === 0) return;
    try {
      firebase.initializeApp(cfg);
      this.db = firebase.firestore();
      this.ready = true;
    } catch (e) { this.ready = false; }
  },
  // 탐험가 코드로 저장된 데이터 읽기
  async load(code){
    if (!this.ready) return null;
    try {
      const doc = await this.db.collection('players').doc(code).get();
      return doc.exists ? doc.data().state : null;
    } catch (e) { return null; }
  },
  // 탐험가 코드로 데이터 저장
  async save(code, state){
    if (!this.ready) return false;
    try {
      await this.db.collection('players').doc(code)
        .set({ state, updatedAt: Date.now() });
      return true;
    } catch (e) { return false; }
  },
  // 데이터 삭제
  async remove(code){
    if (!this.ready) return;
    try { await this.db.collection('players').doc(code).delete(); } catch (e) {}
  }
};

/* ============================================================
   2) 저장소 계층 (로컬 즉시 저장 + 클라우드 동기화)
   ------------------------------------------------------------
   - 로컬(localStorage): 항상 즉시 저장 → 빠르고 오프라인에서도 안전
   - 클라우드(Firebase): 여유될 때 저장 → 기기 간 이어서 하기
   ============================================================ */
const Store = {
  code:null,                                  // 현재 탐험가 코드
  localKey(){ return 'explorer_save_' + this.code; },

  // 로컬 스토리지 사용 가능 여부
  hasLocal:(() => { try{ localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); return true; }catch(e){ return false; } })(),

  // 로그인: 코드 저장 + 클라우드/로컬에서 데이터 불러오기
  async login(code){
    this.code = code;
    if (this.hasLocal) localStorage.setItem('explorer_last_code', code);

    // 로컬 우선 로드(즉시 화면 표시용)
    let local = null;
    if (this.hasLocal){
      const raw = localStorage.getItem(this.localKey());
      if (raw) { try { local = JSON.parse(raw); } catch(e){} }
    }
    // 클라우드 로드(있으면 여러 기기의 최신 기준)
    const cloud = await Cloud.load(code);

    // 클라우드에 값이 있으면 클라우드를, 없으면 로컬을 사용
    return cloud || local || null;
  },

  // 저장: 로컬 즉시 + 클라우드 시도, 상태 콜백으로 알림
  async save(state, onStatus){
    if (this.hasLocal) localStorage.setItem(this.localKey(), JSON.stringify(state));
    if (Cloud.ready){
      if (onStatus) onStatus('saving');
      const ok = await Cloud.save(this.code, state);
      if (onStatus) onStatus(ok ? 'saved' : 'error');
    } else {
      if (onStatus) onStatus('local');
    }
  },

  // 현재 탐험가 기록 삭제(로컬+클라우드)
  async clear(){
    if (this.hasLocal) localStorage.removeItem(this.localKey());
    await Cloud.remove(this.code);
  }
};

function currentQuests(){
  const term = TERMS.find(t => t.id === STATE.term) || TERMS[0];
  return term.quests;
}

// 반복 학습 시 보여줄 문제 고르기: 틀렸던 문제·고난도 문제는 계속 나올 수 있고,
// 이미 맞힌 일반 문제는 아직 안 나온 새 문제로 교체된다.
// 날짜+퀘스트로 시드를 만들어 매일 다른(그러나 같은 날엔 일정한) 순서로 섞기
// 매번 열 때마다 무작위로 섞기(날짜에 고정하지 않음) — 같은 날 다시 들어가도 매번 다르게 나옴
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function buildSession(group, size){
  size = size || 5;
  const pool = group.questions;
  const mustRepeat = [], fresh = [], mastered = [];
  pool.forEach(q => {
    if (STATE.wrongQ.includes(q.id) || q.hard) mustRepeat.push(q);
    else if (!STATE.doneQ.includes(q.id)) fresh.push(q);
    else mastered.push(q);
  });
  const session = shuffle(mustRepeat).slice(0, size);
  shuffle(fresh).forEach(q => { if (session.length < size) session.push(q); });
  shuffle(mastered).forEach(q => { if (session.length < size) session.push(q); });
  return shuffle(session);
}

function defaultState(){

}
let STATE = defaultState();
const LV_EXP = 500;

function grant(exp, gold){
  STATE.exp += exp; STATE.gold += gold;
  while (STATE.exp >= LV_EXP){ STATE.exp -= LV_EXP; STATE.level += 1; }
}
function levelTitle(lv){
  if (lv >= 8) return '전설의 탐험왕';
  if (lv >= 5) return '베테랑 탐험가';
  if (lv >= 3) return '용감한 탐험가';
  return '탐험 새싹';
}

const modalBg = $('#modalBg');
const modalContent = $('#modalContent');
let quiz = null;

const SESSION_SIZE = 5;      // 한 판에 보여줄 문제 수
const QUESTION_REWARD = 5;   // 새로 맞힌 문제 1개당 포인트

function openQuestQuiz(qz){
  const session = buildSession(qz, SESSION_SIZE);
  quiz = { type:'quest', data:qz, idx:0, questions:session, perReward:QUESTION_REWARD, earned:0 };
  showStory(null, qz.subject + ' 퀘스트', () => showQuestion());
}
function openHistoryStage(st){
  const session = buildSession(st, SESSION_SIZE);
  quiz = { type:'history', data:st, idx:0, questions:session, perReward:QUESTION_REWARD, earned:0 };
  showStory(st.story, st.era + ' 이야기', () => showQuestion());
}

function showStory(story, tag, onNext){
  openModal();
  if (!story){ onNext(); return; }
  modalContent.innerHTML =
    '<div class="modal-head"><span class="tag">📖 ' + tag + '</span><button class="x" id="closeX">✕</button></div>' +
    '<div class="story">' + story + '</div>' +
    '<button class="tts-btn" id="ttsStory">🔊 읽어주기</button>' +
    '<button class="next-btn" id="storyNext" disabled>🔊 이야기를 다 읽으면 시작할 수 있어요</button>';
  $('#closeX').onclick = closeModal;

  // 이야기 설명을 다 읽어야 "퀴즈 시작" 버튼이 눌리게 함
  const nextBtn = $('#storyNext');
  const ttsBtn = $('#ttsStory');
  let unlocked = false;
  const lock = () => {
    unlocked = false;
    nextBtn.disabled = true;
    nextBtn.textContent = '🔊 이야기를 다 읽으면 시작할 수 있어요';
    ttsBtn.disabled = true;
    ttsBtn.textContent = '🔊 읽는 중...';
  };
  const unlock = () => {
    if (unlocked) return;
    unlocked = true;
    nextBtn.disabled = false;
    nextBtn.textContent = '퀴즈 시작! 🚀';
    ttsBtn.disabled = false;
    ttsBtn.textContent = '🔊 다시 듣기';
  };
  ttsBtn.onclick = () => { lock(); speak(story, unlock); setTimeout(unlock, 20000); };
  nextBtn.onclick = () => { if (unlocked) onNext(); };
  lock();
  speak(story, unlock);
  setTimeout(unlock, 20000); // 음성 재생이 실패해도 20초 뒤엔 풀리도록 하는 안전장치
}

function showQuestion(){
  const cur = quiz.questions[quiz.idx];
  const total = quiz.questions.length;
  let dots = '';
  for (let i=0;i<total;i++) dots += '<i class="' + (i<=quiz.idx?'on':'') + '"></i>';
  let opts = '';
  cur.options.forEach((o,i) => { opts += '<button class="opt" data-i="' + i + '">' + o + '</button>'; });
  modalContent.innerHTML =
    '<div class="modal-head"><span class="tag">문제 ' + (quiz.idx+1) + ' / ' + total + '</span><button class="x" id="closeX">✕</button></div>' +
    '<div class="progress-dots">' + dots + '</div>' +
    '<div class="qtext">' + cur.q + '</div>' +
    '<button class="tts-btn" id="ttsQ">🔊 문제 읽어주기</button>' +
    '<div class="options" id="opts">' + opts + '</div>' +
    '<div class="feedback" id="feedback"></div>';
  $('#closeX').onclick = closeModal;
  const ttsBtn = $('#ttsQ');
  const optBtns = $('#opts').querySelectorAll('.opt');
  optBtns.forEach(btn => {
    btn.onclick = () => checkAnswer(parseInt(btn.dataset.i), cur);
  });

  if (quiz.type === 'history'){
    // 한국사는 음성 안내가 끝나야 답을 고를 수 있음
    let unlocked = false;
    const lock = () => {
      unlocked = false;
      optBtns.forEach(b => b.disabled = true);
      ttsBtn.disabled = true;
      ttsBtn.textContent = '🔊 읽는 중...';
    };
    const unlock = () => {
      if (unlocked) return;
      unlocked = true;
      optBtns.forEach(b => b.disabled = false);
      ttsBtn.disabled = false;
      ttsBtn.textContent = '🔊 다시 듣기';
    };
    ttsBtn.onclick = () => { lock(); speak(cur.q, unlock); setTimeout(unlock, 12000); };
    lock();
    speak(cur.q, unlock);
    setTimeout(unlock, 12000); // 음성 재생이 실패해도 12초 뒤엔 풀리도록 하는 안전장치
  } else {
    ttsBtn.onclick = () => speak(cur.q);
  }
}

const WRONG_PENALTY = 5; // 오답 시 깎이는 골드

async function checkAnswer(picked, cur){
  const btns = $('#opts').querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  const correct = picked === cur.answer;
  btns[picked].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) btns[cur.answer].classList.add('correct');
  const fb = $('#feedback'); fb.classList.add('show');
  if (correct){
    const isNew = !STATE.doneQ.includes(cur.id);
    if (isNew){
      STATE.doneQ.push(cur.id);
      grant(quiz.perReward, quiz.perReward);
      quiz.earned += quiz.perReward;
      renderTopbar();
      await Store.save(STATE, setSync);
    }
    fb.innerHTML =
      '<div class="big" style="color:var(--mint)">정답이에요! 🎉</div>' +
      (isNew
        ? '<div class="hint" style="color:var(--gold)">🪙+' + quiz.perReward + ' ⭐+' + quiz.perReward + '</div>'
        : '<div class="hint">이미 맞혔던 문제라 포인트는 없어요</div>') +
      '<button class="next-btn" id="nextQ">' + (quiz.idx+1 < quiz.questions.length ? '다음 문제 ▶' : '보상 받기 🎁') + '</button>';
    $('#nextQ').onclick = nextQuestion;
  } else {
    if (!STATE.wrongQ.includes(cur.id)) STATE.wrongQ.push(cur.id);
    const lost = Math.min(WRONG_PENALTY, STATE.gold);
    STATE.gold -= lost;
    renderTopbar();
    await Store.save(STATE, setSync);
    fb.innerHTML =
      '<div class="big" style="color:var(--coral)">아깝다! 다시 도전해볼까? 💪</div>' +
      (lost > 0 ? '<div class="hint" style="color:var(--red)">🪙 -' + lost + '</div>' : '') +
      '<div class="hint">💡 힌트: ' + cur.hint + '</div>' +
      '<button class="next-btn" id="retryQ" style="background:var(--mint);box-shadow:0 5px 0 #35a07f">다시 풀기 🔁</button>';
    $('#retryQ').onclick = () => showQuestion();
  }
}

function nextQuestion(){
  quiz.idx += 1;
  if (quiz.idx < quiz.questions.length) showQuestion(); else finishQuiz();
}

async function finishQuiz(){
  const gain = quiz.earned; // 이번 세션에서 "새로 맞힌" 문제로 얻은 포인트(복습만 했다면 0)
  let popEmoji, popTitle, extra = '';
  if (quiz.type === 'quest'){
    const qz = quiz.data;
    if (!STATE.doneQuests.includes(qz.id)) STATE.doneQuests.push(qz.id);
    popEmoji = qz.icon; popTitle = qz.title + ' 완료!';
  } else {
    const st = quiz.data;
    const firstClear = !STATE.clearedStages.includes(st.id);
    if (firstClear){
      STATE.clearedStages.push(st.id); STATE.cards.push(st.id);
      extra = '<div class="gain">🃏 [' + st.card.name + '] 카드 획득!</div>';
    }
    popEmoji = st.card.emoji; popTitle = st.era + ' 클리어!';
  }
  await renderAll();
  modalContent.innerHTML =
    '<div class="reward-pop"><div class="emoji">' + popEmoji + '</div>' +
    '<div class="title">' + popTitle + '</div>' +
    (gain > 0
      ? '<div class="gain">🪙 +' + gain + '   ⭐ +' + gain + '</div>'
      : '<div class="gain" style="color:var(--muted)">복습 완료! (이미 맞혔던 문제라 추가 포인트는 없어요)</div>') +
    extra +
    '<button class="next-btn" id="doneBtn" style="margin-top:20px">좋아! 계속하기 ✨</button></div>';
  $('#doneBtn').onclick = closeModal;
}

async function buyItem(item){
  if (STATE.gold < item.price){ toast('골드가 부족해요 🪙'); return; }
  STATE.gold -= item.price; STATE.boughtLog.push(item.id);
  await renderAll();
  toast(item.emoji + ' ' + item.name + ' 교환 완료!');
}

function openModal(){ modalBg.classList.add('open'); }

// 기기에 설치된 한국어 음성 중 더 자연스러운 것(Google/Neural 등)을 우선 선택
let koVoices = [];
function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  koVoices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().indexOf('ko') === 0);
}
if ('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  if (!koVoices.length) return null;
  return koVoices.find(v => /google|natural|neural|online/i.test(v.name)) || koVoices[0];
}

let speakToken = 0;
function stopSpeak(){
  speakToken++;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}
function speak(text, onDone){
  if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
  stopSpeak();
  const myToken = speakToken;
  const voice = pickVoice();
  // 문장 단위로 끊어 읽어야 억양이 자연스럽고 숨 쉬는 틈이 생김
  const sentences = text.split(/(?<=[.!?~])\s+/).filter(s => s.trim());
  const queue = sentences.length ? sentences : [text];
  let i = 0;
  const speakNext = () => {
    if (myToken !== speakToken) return; // 중간에 취소된 경우 — onDone 호출 안 함
    if (i >= queue.length) { if (onDone) onDone(); return; }
    const u = new SpeechSynthesisUtterance(queue[i].trim());
    u.lang = 'ko-KR';
    if (voice) u.voice = voice;
    u.rate = 1;
    u.pitch = 1.05;
    u.onend = () => { i++; setTimeout(speakNext, 120); };
    window.speechSynthesis.speak(u);
  };
  speakNext();
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    $('#screen-' + tab.dataset.screen).classList.add('active');
  };
});

$('#calBtn').onclick = () => openCalendar();

$('#termSelect').onchange = async (e) => {
  STATE.term = e.target.value;
  await renderAll();
};

$('#resetBtn').onclick = async () => {
  if (confirm('이 탐험가의 기록을 모두 지우고 처음부터 다시 시작할까요?')){
    STATE = defaultState();
    await Store.clear();
    if (Store.hasLocal) localStorage.removeItem('explorer_last_code');
    location.reload(); // 로그인 화면으로 되돌아감
  }
};

/* ============================================================
   8) 로그인 → 앱 시작
   ============================================================ */
// 출석 체크: 오늘 처음 접속이면 골드 지급, 5일 연속이면 보너스 추가
function checkAttendance(){
  const today = new Date().toDateString();
  if (STATE.lastAttendance === today) return null; // 오늘은 이미 받음
  const y = new Date(); y.setDate(y.getDate() - 1);
  STATE.streak = (STATE.lastAttendance === y.toDateString()) ? STATE.streak + 1 : 1;
  STATE.lastAttendance = today;
  if (!STATE.attendanceDates.includes(today)) STATE.attendanceDates.push(today);
  const bonus = (STATE.streak % 5 === 0) ? 30 : 0;
  const gain = 10 + bonus;
  STATE.gold += gain;
  return { gain, bonus, streak: STATE.streak };
}

// 출석 보상 팝업
function showAttendanceReward(att){
  openModal();
  modalContent.innerHTML =
    '<div class="reward-pop"><div class="emoji">📅</div>' +
    '<div class="title">오늘도 출석 완료!</div>' +
    '<div class="gain">🪙 +10</div>' +
    (att.bonus > 0 ? '<div class="gain">🔥 ' + att.streak + '일 연속 출석 보너스! 🪙 +' + att.bonus + '</div>' : '') +
    '<div style="color:var(--muted);font-size:13px;margin-top:8px">연속 출석 ' + att.streak + '일째</div>' +
    '<button class="next-btn" id="attDone" style="margin-top:20px">시작하기 ✨</button>' +
    '<button class="tts-btn" id="attCal" style="margin-top:10px">📅 출석 달력 보기</button></div>';
  $('#attDone').onclick = closeModal;
  $('#attCal').onclick = () => openCalendar();
}

// 출석 달력
let calViewDate = new Date();
function openCalendar(viewDate){
  calViewDate = viewDate || new Date();
  openModal();
  renderCalendar();
}
function renderCalendar(){
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = new Date().toDateString();
  const attended = new Set(STATE.attendanceDates);

  const dowLabels = ['일','월','화','수','목','금','토'];
  let dow = dowLabels.map(d => '<div class="cal-dow">' + d + '</div>').join('');

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
  let monthAttended = 0;
  for (let d = 1; d <= daysInMonth; d++){
    const key = new Date(y, m, d).toDateString();
    const isToday = key === todayStr;
    const isAttended = attended.has(key);
    if (isAttended) monthAttended++;
    cells += '<div class="cal-cell' + (isToday ? ' today' : '') + (isAttended ? ' attended' : '') + '">' +
      '<span>' + d + '</span>' + (isAttended ? '<i class="dot"></i>' : '') +
      '</div>';
  }

  modalContent.innerHTML =
    '<div class="modal-head"><span class="tag">📅 출석 달력</span><button class="x" id="closeX">✕</button></div>' +
    '<div class="cal-nav"><button id="calPrev">‹</button><b>' + y + '년 ' + (m + 1) + '월</b><button id="calNext">›</button></div>' +
    '<div class="cal-grid">' + dow + cells + '</div>' +
    '<div style="color:var(--muted);font-size:13px;margin-top:14px;text-align:center">이번 달 출석 ' + monthAttended + '일 · 연속 출석 ' + STATE.streak + '일째</div>';
  $('#closeX').onclick = closeModal;
  $('#calPrev').onclick = () => { calViewDate = new Date(y, m - 1, 1); renderCalendar(); };
  $('#calNext').onclick = () => { calViewDate = new Date(y, m + 1, 1); renderCalendar(); };
}

// 코드로 로그인하고 데이터 불러와 앱 시작
async function startWithCode(code){
  const saved = await Store.login(code);
  STATE = saved ? Object.assign(defaultState(), saved) : defaultState();
  $('#loginScreen').style.display = 'none';   // 로그인 화면 숨김
  const att = checkAttendance();
  await renderAll();
  if (att) showAttendanceReward(att);
}

// 로그인 버튼
$('#loginBtn').onclick = () => {
  const code = $('#codeInput').value.trim();
  if (!code){ $('#codeInput').focus(); return; }
  startWithCode(code);
};
// 엔터로도 로그인
$('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#loginBtn').click(); });

// 페이지 시작
(function boot(){
  Cloud.init();
  // 로그인 화면에 현재 저장 모드 안내
  $('#loginMode').textContent = Cloud.ready
    ? '☁️ 클라우드 동기화 켜짐 · 여러 기기에서 이어서 할 수 있어요'
    : '💾 이 기기에만 저장 중 · Firebase 설정을 넣으면 기기 간 동기화돼요';

  // 지난번에 쓴 코드가 있으면 자동 로그인
  const last = Store.hasLocal ? localStorage.getItem('explorer_last_code') : null;
  if (last){ startWithCode(last); }
})();
</script>
